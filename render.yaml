services:
  - type: web
    name: typeflow
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: typeflow-db
          property: connectionString

databases:
  - name: typeflow-db
    databaseName: typeflow
    user: typeflow
